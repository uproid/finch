name: finch
description: Finch is a fast, lightweight Dart framework for building scalable server-side web apps, REST APIs, databases, WebSockets, and MCP servers

version: 1.6.0
homepage: https://finchdart.com/
repository: https://github.com/uproid/finch.git
issue_tracker: https://github.com/uproid/finch/issues

platforms:
  linux:
  windows:
  macos:
  ios:
  android:
funding:
  - https://github.com/sponsors/uproid

topics:
  - webapp
  - server
  - api
  - database
  - websocket

sdk:
  dart:

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  build_runner: ^2.16.0
  test: ^1.31.2
  html: ^0.15.7
  lints: ^6.1.0

# Add regular dependencies here.
dependencies:
  path: ^1.9.1
  json_annotation: ^4.12.0
  mongo_dart: ^0.10.9
  pointycastle: ^4.0.0
  mailer: ^7.2.0
  jinja: ^0.7.0
  intl: ^0.20.3
  mime: ^2.1.0
  base32: ^2.2.0
  archive: ^4.2.0
  capp: ^2.2.0
  mysql_client_plus: ^0.1.3
  sqlite3: ^3.5.2
  sqler: ^1.2.1
  html_unescape: ^2.0.0
  yaml: ^3.1.4
  mcp_models: 2.1.0
executables:
  finch: finch

finch:
  serve: ./example/lib/watcher.dart
  app: ./example/lib/app.dart
  mysql_migrate:
    path: ./example/migrations
    type: sql
  sqlite_migrate:
    path: ./example/lib/dart_migration
    type: dart
